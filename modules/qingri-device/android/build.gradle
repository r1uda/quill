plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'qingri.device'
version = '0.1.0'
android {
  namespace 'qingri.device'
  defaultConfig { versionCode 1; versionName '0.1.0'; consumerProguardFiles 'consumer-rules.pro' }
  testOptions { unitTests.includeAndroidResources = true }
}
dependencies {
  implementation files('libs/sherpa-onnx-1.12.20.jar')
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.robolectric:robolectric:4.16.1'
}
